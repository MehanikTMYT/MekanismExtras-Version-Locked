plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
    alias libs.plugins.lombok
}

group = maven_group
boolean isSnapshot = System.getenv("SNAPSHOT")
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    clientExtra {
        compileClasspath += client.output + extra.compileClasspath
        runtimeClasspath += client.output + client.runtimeClasspath + extra.runtimeClasspath
    }
}

configurations {
    // set these as unresolvable so we don't accidentally force all dependents to use them with us
    clientRuntimeOnly.canBeResolved = false
    extraRuntimeOnly.canBeResolved = false
    clientExtraRuntimeOnly.canBeResolved = false

    runtimeClasspath.extendsFrom localRuntime
    extraRuntimeClasspath.extendsFrom extraLocalRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    extraClientRuntimeClasspath.extendsFrom clientExtraLocalRuntime
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs.addAll(["-Xmaxerrs", "10000"])
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}

lombok {
    version = "1.18.44"
}// ModDevGradle's asset helper defaults to Java 21; this port builds and runs on Java 25.
tasks.named('downloadAssets') {
    javaExecutable.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath })
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

if (!providers.gradleProperty("jemmSmoke").isPresent()) sourceSets.test.java.exclude("**/TransmitterVisualSmoke.java")
if (!providers.gradleProperty("addonSmoke").isPresent()) sourceSets.test.java.exclude("**/AddonVisualSmoke.java")
if (!providers.gradleProperty("reactorSmoke").isPresent()) sourceSets.test.java.exclude("**/ReactorFunctionalSmoke.java")
if (!providers.gradleProperty("guideClientSmoke").isPresent()) sourceSets.test.java.exclude("**/GuideClientSmoke.java")
// These fixtures execute inside Minecraft, rather than as JUnit tests.
tasks.withType(Test).configureEach { failOnNoDiscoveredTests = false }

// Fail the Gradle run if a functional assertion failed even though Minecraft stopped cleanly.
tasks.named('runServer') {
    if (providers.gradleProperty('heaterSmoke').isPresent()) {
        def resultFile = file('/root/home/agent-work/mekanism-port-queue/build/mekanism-extras/server/heater-smoke-result.txt')
        doFirst { delete resultFile }
        doLast {
            if (!resultFile.exists() || resultFile.text.trim() != 'PASS') {
                throw new GradleException('Extras heater functional smoke failed; inspect the server log')
            }
        }
    }
    if (providers.gradleProperty('extrasSmoke').isPresent()) {
        def resultFile = file('/root/home/agent-work/mekanism-port-queue/build/mekanism-extras/server/extras-qa-result.txt')
        doFirst { delete resultFile }
        doLast {
            // PHASE1 = registration + transfer finished; PASS = restart persistence phase done.
            if (!resultFile.exists() || !(resultFile.text.trim() in ['PHASE1', 'PASS'])) {
                throw new GradleException('Extras energy smoke failed; inspect the server log')
            }
        }
    }
}
